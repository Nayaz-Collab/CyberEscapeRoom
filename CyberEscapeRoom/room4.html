<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room 4: SQL Injection // Cyber Escape Room</title>
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="crt crt-flicker">
<canvas id="matrixRain"></canvas>
<div id="breachOverlay"></div>

<div class="wrap">
  <div id="hud"></div>

  <div class="terminal-window fade-in">
    <div class="terminal-titlebar">
      <span class="tb-dot"></span><span class="tb-dot"></span><span class="tb-dot"></span>
      <span class="tb-label">room4 :: LoginService.java</span>
    </div>
    <div class="terminal-body">
      <h1 class="page-title">ROOM 4 — SQL INJECTION</h1>
      <p class="page-subtitle">A chunk of the login service survived. It's flawed.</p>

      <div class="prompt-line"><span class="ps1">cat</span> LoginService.java</div>
      <div class="mono-block" id="codeBlock"></div>

      <p style="margin-top:18px;" id="vulnQuestion"></p>
      <div class="option-list" id="vulnOptions"></div>

      <p style="margin-top:18px;" id="fixQuestion"></p>
      <div class="option-list" id="fixOptions"></div>

      <div class="hint-actions">
        <button class="btn-term" id="hintBtn">💡 Get Hint (−25 pts)</button>
        <span class="hint-counter" id="hintCounter"></span>
      </div>
      <div class="hint-box" id="hintBox"></div>

      <div class="hint-actions">
        <button class="btn-term amber" id="submitBtn">Submit Patch</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <div class="nav-footer">
    <a href="room3.html" class="btn-term" style="text-decoration:none;">&laquo; Room 3</a>
    <span></span>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/game.js"></script>
<script src="js/timer.js"></script>
<script src="js/puzzles.js"></script>
<script>
  const ROOM_KEY = 'room4';
  Game.startMatrixRain();
  if(!Game.isRoomUnlocked(ROOM_KEY)){ window.location.href = 'room3.html'; }
  Game.renderHUD('hud', ROOM_KEY);
  CountdownTimer.start({ onExpire: ()=>{ window.location.href = 'escape.html?ending=timeout'; } });

  document.getElementById('codeBlock').textContent = Puzzles.room4.vulnerableCode;
  document.getElementById('vulnQuestion').textContent = '1. ' + Puzzles.room4.vulnQuestion;
  document.getElementById('fixQuestion').textContent = '2. ' + Puzzles.room4.fixQuestion;

  function buildOptions(mountId, name, options){
    const mount = document.getElementById(mountId);
    options.forEach((label, i)=>{
      const div = document.createElement('label');
      div.className = 'option-item';
      div.innerHTML = `<input type="radio" name="${name}" value="${i}"> <span>${label}</span>`;
      div.addEventListener('click', ()=>{
        document.querySelectorAll(`#${mountId} .option-item`).forEach(o=>o.classList.remove('selected'));
        div.classList.add('selected');
      });
      mount.appendChild(div);
    });
  }
  buildOptions('vulnOptions', 'vulnChoice', Puzzles.room4.vulnOptions);
  buildOptions('fixOptions', 'fixChoice', Puzzles.room4.fixOptions);

  const hintBtn = document.getElementById('hintBtn');
  const hintBox = document.getElementById('hintBox');
  function refreshHintCounter(){
    const used = Game.getState().hintsUsed[ROOM_KEY] || 0;
    document.getElementById('hintCounter').textContent = `Hints used: ${used}/${Puzzles.room4.hints.length}`;
    if(used >= Puzzles.room4.hints.length) hintBtn.disabled = true;
  }
  refreshHintCounter();
  hintBtn.addEventListener('click', ()=>{
    const used = Game.registerHint(ROOM_KEY);
    Game.Sound.key();
    hintBox.textContent = '💡 ' + (Puzzles.room4.hints[used-1] || Puzzles.room4.hints[Puzzles.room4.hints.length-1]);
    hintBox.classList.add('show');
    refreshHintCounter();
  });

  document.getElementById('submitBtn').addEventListener('click', ()=>{
    const feedback = document.getElementById('feedback');
    const vulnChoice = document.querySelector('input[name="vulnChoice"]:checked');
    const fixChoice = document.querySelector('input[name="fixChoice"]:checked');
    const vulnCorrect = vulnChoice && parseInt(vulnChoice.value) === Puzzles.room4.vulnAnswerIndex;
    const fixCorrect = fixChoice && parseInt(fixChoice.value) === Puzzles.room4.fixAnswerIndex;

    if(vulnCorrect && fixCorrect){
      Game.Sound.success();
      const pts = Game.completeRoom(ROOM_KEY);
      Game.updateHudScore();
      feedback.className = 'feedback show ok';
      feedback.textContent = `✔ PATCH DEPLOYED — Key fragment acquired: "${Game.getState().inventory[ROOM_KEY]}"  (+${pts} pts)`;
      document.getElementById('submitBtn').outerHTML = `<a href="${Game.nextRoomFile(ROOM_KEY)}" class="btn-term amber" style="text-decoration:none;display:inline-block;">Proceed to Room 5 ▶</a>`;
    } else {
      Game.registerWrongAttempt(ROOM_KEY);
      Game.Sound.error();
      Game.triggerBreachFlash();
      Game.shakeGlitch(document.querySelector('.page-title'));
      feedback.className = 'feedback show err';
      feedback.textContent = '✘ PATCH REJECTED — ' + (!vulnCorrect ? 'Vulnerability type is incorrect. ' : '') + (!fixCorrect ? 'Chosen fix does not eliminate the flaw.' : '');
    }
  });

  const st = Game.getState();
  if(st.roomsCompleted[ROOM_KEY]){
    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback show ok';
    feedback.textContent = `✔ Already solved — fragment "${st.inventory[ROOM_KEY]}" collected.`;
    document.getElementById('submitBtn').outerHTML = `<a href="${Game.nextRoomFile(ROOM_KEY)}" class="btn-term amber" style="text-decoration:none;display:inline-block;">Proceed to Room 5 ▶</a>`;
  }
</script>
</body>
</html>
